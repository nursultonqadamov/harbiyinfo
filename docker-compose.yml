services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-film_config}
      POSTGRES_USER: ${POSTGRES_USER:-film_config}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-film_config}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd_admin:/etc/nginx/.htpasswd:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - frontend

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  web:
    build: .
    restart: unless-stopped
    # Chat (Channels/websockets) and video transcoding (Celery) were removed
    # in the pivot away from the film platform -- gunicorn alone serves the
    # REST API + admin now, no separate ASGI process needed.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --workers 3 --bind 0.0.0.0:8000 --timeout 120 --graceful-timeout 30"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-film_config}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-film_config}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend-next
    restart: unless-stopped
    environment:
      # Server-to-server calls go through frontend-next/lib/internal-fetch.ts
      # (Node's http module) rather than fetch() -- Node's built-in fetch
      # (undici) was found to hang indefinitely connecting to sibling
      # containers on this host for reasons never fully pinned down, while
      # plain http.request works instantly by hostname. See that file.
      DJANGO_API_BASE_URL: http://web:8000
    expose:
      - "3000"
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  static_data:
  certbot_conf:
  certbot_www:
