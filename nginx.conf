server {
    listen 80;
    server_name cineverse.uz www.cineverse.uz;

    # Let's Encrypt domain-ownership verification (also used for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cineverse.uz www.cineverse.uz;
    client_max_body_size 2G;

    ssl_certificate /etc/letsencrypt/live/cineverse.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cineverse.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's embedded DNS. A static `upstream {}` block resolves the
    # `web` hostname ONCE at nginx startup and caches that container IP
    # forever -- when `web` gets recreated (every deploy), nginx keeps
    # proxying to the dead IP and every request 502s until someone
    # remembers to `nginx -s reload`. Resolving through a variable instead
    # re-resolves on every request (bounded by valid=10s), so a deploy
    # can never take the site down this way again.
    resolver 127.0.0.11 valid=10s;

    # Static files (Django admin CSS/JS, collected by collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (uploaded images/videos)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django API
    location /api/ {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own admin (2FA-protected, dev/db debugging only) -- the
    # bare /admin/ path is reserved for the Next.js custom CMS below.
    location /django-admin/ {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # django-two-factor-auth's login/setup views (guards /admin/)
    location /account/ {
        set $upstream_web http://web:8000;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Extra password gate in front of the custom CMS -- bots/scanners that
    # blindly probe /admin/ never even see the real login form, since this
    # challenge happens before nginx proxies the request anywhere.
    location /admin {
        auth_basic "Cheklangan hudud";
        auth_basic_user_file /etc/nginx/.htpasswd;

        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js app (military-info site) -- everything not matched above.
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
